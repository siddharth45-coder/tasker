<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Tasker - a focused task management workspace" />
  <title>Tasker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#">Tasker</a>
      <div class="topbar-actions">
        <button id="focusBtn" class="ghost-btn" type="button">Focus</button>
        <button id="themeBtn" class="icon-btn" type="button" aria-label="Toggle theme">☾</button>
        <button id="newTaskTop" class="primary-btn" type="button">+ New task</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <div class="sidebar-section">
          <button class="nav-item active" data-view="all"><span>Inbox</span><span id="allCount">0</span></button>
          <button class="nav-item" data-view="today"><span>Today</span><span id="todayCount">0</span></button>
          <button class="nav-item" data-view="upcoming"><span>Upcoming</span><span id="upcomingCount">0</span></button>
          <button class="nav-item" data-view="completed"><span>Completed</span><span id="completedCount">0</span></button>
        </div>
        <div class="sidebar-section">
          <div class="section-label">Priority</div>
          <button class="nav-item" data-priority="high"><span>High</span><span class="dot high"></span></button>
          <button class="nav-item" data-priority="medium"><span>Medium</span><span class="dot medium"></span></button>
          <button class="nav-item" data-priority="low"><span>Low</span><span class="dot low"></span></button>
        </div>
        <div class="sidebar-footer">
          <div class="progress-label"><span>Weekly progress</span><strong id="progressText">0%</strong></div>
          <div class="progress"><span id="progressBar"></span></div>
        </div>
      </aside>

      <main class="main-content">
        <section class="hero">
          <div>
            <p id="dateLabel" class="eyebrow"></p>
            <h1 id="viewTitle">All tasks</h1>
            <p id="viewSubtitle">Everything you need to get done in one place.</p>
          </div>
          <div class="hero-actions">
            <label class="search-box">
              <span>⌕</span>
              <input id="searchInput" type="search" placeholder="Search tasks..." autocomplete="off" />
            </label>
            <select id="sortSelect" class="select" aria-label="Sort tasks">
              <option value="created">Newest</option>
              <option value="due">Due date</option>
              <option value="priority">Priority</option>
              <option value="title">Title</option>
            </select>
          </div>
        </section>

        <section class="stats-grid" aria-label="Task overview">
          <article class="stat-card"><span>Total</span><strong id="statTotal">0</strong></article>
          <article class="stat-card"><span>Open</span><strong id="statOpen">0</strong></article>
          <article class="stat-card"><span>Done</span><strong id="statDone">0</strong></article>
          <article class="stat-card"><span>High priority</span><strong id="statHigh">0</strong></article>
        </section>

        <section id="taskList" class="task-list" aria-live="polite"></section>
      </main>
    </div>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <div><p class="eyebrow">Task editor</p><h2 id="modalTitle">Create task</h2></div>
        <button id="closeModal" class="icon-btn" type="button" aria-label="Close">×</button>
      </div>
      <form id="taskForm">
        <input type="hidden" id="taskId" />
        <label>Title<input id="taskTitle" name="title" required maxlength="120" placeholder="e.g. Finish semester project" /></label>
        <label>Description<textarea id="taskDescription" name="description" maxlength="500" rows="4" placeholder="Add a little context..."></textarea></label>
        <div class="form-grid">
          <label>Due date<input id="taskDue" name="due" type="date" /></label>
          <label>Priority<select id="taskPriority" name="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label>
        </div>
        <label>Tag<input id="taskTag" name="tag" maxlength="30" placeholder="e.g. College" /></label>
        <div class="form-actions"><button id="cancelBtn" class="ghost-btn" type="button">Cancel</button><button class="primary-btn" type="submit">Save task</button></div>
      </form>
    </div>
  </div>

  <template id="taskTemplate">
    <article class="task-card">
      <button class="check-btn" type="button" aria-label="Mark task complete"></button>
      <div class="task-body"><div class="task-topline"><h3 class="task-title"></h3><span class="priority-badge"></span></div><p class="task-description"></p><div class="task-meta"><span class="task-due"></span><span class="task-tag"></span></div></div>
      <div class="task-actions"><button class="icon-btn edit-btn" type="button" aria-label="Edit task">✎</button><button class="icon-btn delete-btn" type="button" aria-label="Delete task">⌫</button></div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
