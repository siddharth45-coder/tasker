<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow — Create account</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"></head><body class="auth-page"><main class="auth-card"><div class="auth-brand">TaskFlow</div><p class="auth-kicker">GET STARTED</p><h1>Create your workspace</h1><p class="auth-muted">Your tasks are stored securely in your own TaskFlow database.</p>{% if error %}<div class="auth-error">{{ error }}</div>{% endif %}<form method="post" class="auth-form"><label>Name<input name="name" autocomplete="name" required maxlength="80" placeholder="Your name"></label><label>Email<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input name="password" type="password" autocomplete="new-password" required minlength="6" placeholder="At least 6 characters"></label><button class="auth-submit" type="submit">Create account</button></form><p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p></main></body></html>
