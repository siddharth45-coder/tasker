<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Sign in to TaskFlow"><title>TaskFlow — Sign in</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"></head><body class="auth-page"><main class="auth-card"><div class="auth-brand">TaskFlow</div><p class="auth-kicker">WELCOME BACK</p><h1>Sign in to your workspace</h1><p class="auth-muted">Manage your tasks, projects and progress in one place.</p>{% if error %}<div class="auth-error" role="alert">{{ error }}</div>{% endif %}<form method="post" class="auth-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Email<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input name="password" type="password" autocomplete="current-password" required placeholder="Your password"></label><button class="auth-submit" type="submit">Sign in</button></form><p class="auth-switch">New to TaskFlow? <a href="{{ url_for('register') }}">Create an account</a></p></main></body></html>
